<!DOCTYPE html>
<html lang="fr"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:dsfr="http://gouv.fr/dsfr-faces">
<h:head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>dsfr-faces – showcase</title>
    <dsfr:head/>
</h:head>
<h:body>
    <main class="fr-container fr-my-6w" id="content" role="main">
        <h1>dsfr-faces</h1>
        <p class="fr-text--lead">Composants Jakarta Faces générant le balisage du DSFR.</p>

        <h:form id="form">
            <dsfr:messages id="msgs" globalOnly="true" showDetail="true" titleTag="h2"/>

            <p class="fr-hint-text">Les champs marqués d'un astérisque (*) sont obligatoires.</p>

            <dsfr:inputText id="name" label="Nom" value="#{contactForm.name}"
                            required="true" autocomplete="family-name"/>

            <dsfr:inputText id="email" label="Adresse électronique" type="email"
                            hint="Format attendu : nom@domaine.fr"
                            value="#{contactForm.email}" required="true" autocomplete="email"
                            validatorMessage="Le format de l'adresse électronique est invalide.">
                <f:validateRegex pattern="[^@\s]+@[^@\s]+\.[^@\s]+"/>
                <!-- validates on blur, re-renders the whole fr-input-group -->
                <f:ajax event="blur" render="@this"/>
            </dsfr:inputText>

            <dsfr:inputText id="age" label="Âge" hint="Converti en Integer automatiquement"
                            type="number" inputmode="numeric" value="#{contactForm.age}"/>

            <!-- inside a fr-btns-group, icon placement is set on the group, not on the buttons -->
            <ul class="fr-btns-group fr-btns-group--inline-md fr-btns-group--icon-left">
                <li>
                    <dsfr:button id="send" value="Envoyer (ajax)" action="#{contactForm.submit}"
                                 icon="fr-icon-send-plane-line">
                        <f:ajax execute="@form" render="@form"/>
                    </dsfr:button>
                </li>
                <li>
                    <dsfr:button id="sendFull" value="Envoyer (sans ajax)" priority="secondary"
                                 action="#{contactForm.submit}"/>
                </li>
                <li>
                    <dsfr:button id="reset" value="Effacer" type="reset" priority="tertiary"/>
                </li>
            </ul>
        </h:form>
    </main>
</h:body>
</html>
