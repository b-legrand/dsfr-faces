# Intégration continue : build Maven (DSFR récupéré par npm, tests unitaires), puis tests
# d'intégration Playwright (Chromium, Firefox) contre le showcase sur GlassFish, via docker compose.
# Réutilisée par release.yml (workflow_call) avant toute publication.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # also caches the Node downloaded by frontend-maven-plugin (in ~/.m2)

      - name: Build
        run: mvn -B -ntp verify

      - name: Rapports des tests unitaires
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: showcase-war
          path: dsfr-faces-showcase/target/dsfr-faces-showcase.war
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Tests d'intégration (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: showcase-war
          path: dsfr-faces-showcase/target

      - name: docker compose (GlassFish + Playwright)
        run: |
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          export HOST_UID HOST_GID
          docker compose up --build --abort-on-container-exit --exit-code-from e2e

      - name: Journal du serveur
        if: failure()
        run: docker compose logs showcase

      - name: Arrêt
        if: always()
        run: docker compose down --volumes

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
